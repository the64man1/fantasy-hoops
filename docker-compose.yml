services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fantasyhoops
      POSTGRES_USER: fantasyhoops
      POSTGRES_PASSWORD: localdev
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasyhoops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
